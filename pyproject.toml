[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ac"
version = "0.1.0"
description = "Agentless CLI chat for local Ollama models, with persistent sessions and opt-in skills"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ac = "ac.cli:main"

[tool.setuptools]
packages = ["ac"]
