<style>
:root {
  --bg: #fbfaf8; --panel: #f3f1ed; --text: #1f1d1a; --muted: #6f6a62; --line: #e2ded6;
  --accent: #c8651b; --accent-soft: #f6e4d4; --user: #ecebe7; --code: #f0eee9; --warn: #a33b2b; --amber: #a86a12;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1a18; --panel: #232220; --text: #ebe8e2; --muted: #9c968c; --line: #34322e;
    --accent: #e08a45; --accent-soft: #3a2a1d; --user: #2b2a27; --code: #262522; --warn: #e07a66; --amber: #e0a64a;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.55 var(--sans); display: flex; }

#sidebar { width: 300px; flex: none; background: var(--panel); border-right: 1px solid var(--line);
           display: flex; flex-direction: column; min-height: 0; }
#sidebar header { padding: 14px 14px 10px; }
#sidebar .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
#sidebar h1 { font-size: 15px; margin: 0; color: var(--accent); letter-spacing: .02em; }
#sidebar .who { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
#me { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
button { font: inherit; cursor: pointer; }
.btn { border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 8px;
       padding: 5px 12px; font-size: 13px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }
#search { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px;
          background: var(--bg); color: var(--text); font: inherit; font-size: 14px; }
#search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
#sessions { list-style: none; margin: 0; padding: 0 8px 12px; overflow-y: auto; flex: 1; }
#sessions li a { display: block; padding: 8px 10px; border-radius: 8px; color: inherit;
                 text-decoration: none; }
#sessions li a:hover { background: var(--user); }
#sessions li a[aria-current] { background: var(--accent-soft); }
#sessions .title { display: block; font-size: 14px; white-space: nowrap; overflow: hidden;
                   text-overflow: ellipsis; }
#sessions .meta { display: block; font-size: 12px; color: var(--muted); }
#sessions .empty { padding: 10px; color: var(--muted); font-size: 14px; }

#main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
#main > header { padding: 14px 24px; border-bottom: 1px solid var(--line); }
#main > header h2 { margin: 0; font-size: 17px; overflow-wrap: anywhere; min-width: 0; }
.title-row { display: flex; align-items: center; gap: 4px; }
.title-row h2:has(#title-edit) { flex: 1; }
.rename { flex: none; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center;
          border: 0; border-radius: 6px; background: none; color: var(--muted); }
.rename:hover { background: var(--panel); color: var(--accent); }
.rename svg { width: 15px; height: 15px; }
.rename[hidden] { display: none; }
#header-toggle { margin-left: auto; }
#header-toggle svg { transition: transform .15s; }
body.header-collapsed #header-toggle svg { transform: rotate(180deg); }
body.header-collapsed #main > header { display: flex; align-items: center; gap: 10px; padding-top: 6px; padding-bottom: 6px; }
body.header-collapsed .title-row { flex: 1; min-width: 0; }
body.header-collapsed #main > header h2 { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
body.header-collapsed .meta-row, body.header-collapsed .controls { display: none; }
#sidebar footer { display: flex; justify-content: flex-end; align-items: center; padding: 8px; }
.archived-link { margin-right: auto; border: 0; background: none; color: var(--muted); font-size: 13px;
                 padding: 6px 8px; border-radius: 6px; }
.archived-link:hover { background: var(--user); color: var(--accent); }
.archived-link[hidden], body.sidebar-collapsed .archived-link { display: none; }
#sidebar .viewing { font-size: 12px; color: var(--muted); padding: 0 10px 6px; text-transform: uppercase;
                    letter-spacing: .04em; }
.edge { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center;
        border: 0; border-radius: 8px; background: none; color: var(--muted); }
.edge:hover { background: var(--user); color: var(--accent); }
.edge svg { width: 18px; height: 18px; }
.rail { display: none; flex-direction: column; align-items: center; gap: 10px; padding: 14px 0; flex: 1; }
.rail-new { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center;
            border: 0; border-radius: 14px; background: var(--accent-soft); color: var(--accent); }
.rail-new:hover, .new-chat:hover { filter: brightness(.96); }
.new-chat { width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center;
            border: 0; border-radius: 10px; background: var(--accent-soft); color: var(--accent); }
.new-chat svg { width: 17px; height: 17px; }
.new-chat:disabled { opacity: .5; cursor: default; }
.rail-new svg { width: 20px; height: 20px; }
#sidebar-toggle svg { transition: transform .15s; }
/* Collapsed, the list keeps a narrow rail: new chat, search, and the way back out. */
body.sidebar-collapsed #sidebar { width: 64px; }
body.sidebar-collapsed #sidebar header, body.sidebar-collapsed #sessions { display: none; }
body.sidebar-collapsed .rail { display: flex; }
body.sidebar-collapsed #sidebar footer { justify-content: center; }
body.sidebar-collapsed #sidebar-toggle svg { transform: rotate(180deg); }
#main > header .meta { font-size: 13px; color: var(--muted); }
#back { display: none; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; position: relative; }
select.btn { padding-right: 8px; max-width: 100%; }
.panel { position: absolute; top: 100%; left: 0; z-index: 5; margin-top: 4px; min-width: 260px;
                max-width: min(420px, calc(100vw - 32px)); max-height: 50vh; overflow-y: auto;
                background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
                box-shadow: 0 8px 24px rgba(0, 0, 0, .12); padding: 6px; }
.panel label { display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px;
                      border-radius: 6px; cursor: pointer; font-size: 14px; }
.panel label:hover { background: var(--panel); }
.panel input { margin-top: 4px; accent-color: var(--accent); }
.panel small { display: block; color: var(--muted); font-size: 12px; }
.panel .empty { padding: 6px 8px; color: var(--muted); font-size: 13px; }
#export-panel { left: auto; right: 0; }
.panel .actions { display: flex; flex-direction: column; gap: 6px; padding: 6px 8px 4px; }
.panel .actions .btn { text-align: left; }
.panel .status { padding: 4px 8px; font-size: 13px; color: var(--muted); }
.controls .spacer { flex: 1; }
.controls .confirm { font-size: 13px; color: var(--warn); align-self: center; }
.btn.danger { color: var(--warn); }
.btn.icon { width: 32px; height: 32px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
            color: var(--muted); vertical-align: middle; }
.btn.icon:hover { color: var(--accent); }
.btn.icon.danger:hover { color: var(--warn); border-color: var(--warn); }
.btn.icon svg { width: 17px; height: 17px; }
.btn.danger.primary { background: var(--warn); border-color: var(--warn); color: #fff; }
#title-edit { width: 100%; font: 600 17px var(--sans); padding: 2px 6px; border: 1px solid var(--accent);
              border-radius: 6px; background: var(--bg); color: var(--text); }
#chat { flex: 1; overflow-y: auto; padding: 20px 24px 40px; }
#chat .inner { max-width: 780px; margin: 0 auto; }
.placeholder { color: var(--muted); text-align: center; margin-top: 20vh; }
.note { font-size: 13px; color: var(--muted); margin: -12px 0 18px; }
.note.error { color: var(--warn); }
.note .btn { margin-left: 8px; }
.msg.pending .body:empty::after { content: "…"; color: var(--muted); }
.msg.sending { opacity: .6; }
.msg .actions { display: flex; align-items: center; gap: 2px; margin-top: 4px; opacity: 0; transition: opacity .12s; }
.msg:hover .actions, .msg:focus-within .actions, .msg .actions.asking { opacity: 1; }
@media (hover: none) { .msg .actions { opacity: 1; } }
.msg.user .actions { justify-content: flex-end; }
.act { width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center;
       border: 0; border-radius: 6px; background: none; color: var(--muted); }
.act:hover { background: var(--panel); color: var(--accent); }
.act svg { width: 15px; height: 15px; }
.msg .actions .confirm { font-size: 13px; color: var(--warn); margin-right: 6px; }
.msg .actions .btn { padding: 2px 10px; font-size: 12px; margin-left: 4px; }

#composer { border-top: 1px solid var(--line); padding: 12px 24px 16px; }
#composer form { max-width: 780px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
#input { flex: 1; resize: none; min-height: 42px; max-height: 40vh; padding: 10px 12px;
         border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text);
         font: inherit; line-height: 1.45; }
#input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
#composer .btn { padding: 10px 16px; font-size: 14px; }
.meta-row { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 14px; }
.status-line { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.status-line .meter { display: inline-block; width: 48px; height: 5px; border-radius: 3px; background: var(--line);
                      vertical-align: middle; margin: 0 6px 1px 0; overflow: hidden; }
.status-line .meter i { display: block; height: 100%; background: var(--muted); }
.status-line.full-ish .usage { color: var(--amber); } .status-line.full-ish .meter i { background: var(--amber); }
.status-line.full .usage { color: var(--warn); } .status-line.full .meter i { background: var(--warn); }
#composer .btn.attach { padding: 0; width: 44px; height: 44px; display: inline-flex; align-items: center;
                        justify-content: center; color: var(--muted); flex: none; }
#composer .btn.attach:hover { color: var(--accent); }
#composer .btn.attach svg { width: 20px; height: 20px; }
#composer .btn.go { padding: 0; width: 42px; height: 42px; display: inline-flex; align-items: center;
                    justify-content: center; flex: none; }
#composer .btn.go svg { width: 20px; height: 20px; }
#pending { max-width: 780px; margin: 0 auto 8px; display: flex; flex-wrap: wrap; gap: 6px; }
#pending:empty { display: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 12px var(--mono);
        background: var(--code); border: 1px solid var(--line); padding: 3px 4px 3px 8px; border-radius: 6px; }
.chip button { border: 0; background: none; color: var(--muted); padding: 0 4px; font-size: 14px; line-height: 1; }
.chip button:hover { color: var(--warn); }
.thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.thumbs img { max-width: 220px; max-height: 180px; border-radius: 8px; border: 1px solid var(--line); }
#skills-sheet { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .35);
          display: flex; align-items: center; justify-content: center; padding: 16px; }
#skills-sheet[hidden] { display: none; }
#skills-sheet .sheet { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 12px;
                 width: min(680px, 100%); height: min(640px, 100%); display: flex; flex-direction: column;
                 box-shadow: 0 16px 48px rgba(0, 0, 0, .25); min-height: 0; }
#skills-sheet header { display: flex; gap: 10px; align-items: center; padding: 12px 14px 8px; }
#skills-sheet h3 { flex: 1; min-width: 0; margin: 0; font-size: 15px; overflow: hidden; text-overflow: ellipsis;
                   white-space: nowrap; }
#skills-sheet [hidden] { display: none; }
#skills-list { list-style: none; margin: 0; padding: 0 8px 12px; overflow-y: auto; flex: 1;
               border-top: 1px solid var(--line); }
#skills-list li > button { display: block; width: 100%; text-align: left; border: 0; background: none; color: inherit;
                           padding: 7px 8px; border-radius: 6px; font: inherit; font-size: 14px; }
#skills-list li > button:hover { background: var(--panel); }
#skills-list small { display: block; color: var(--muted); font-size: 12px; }
#skills-list .section { font-size: 12px; color: var(--muted); padding: 12px 8px 2px; }
#skills-list .empty { padding: 4px 8px; color: var(--muted); font-size: 13px; }
#skill-form { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px 14px; flex: 1; min-height: 0;
              overflow-y: auto; border-top: 1px solid var(--line); }
#skill-form .field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
#skill-form .field.grow { flex: 1; min-height: 10em; }
#skill-form input[type=text], #skill-form textarea { font: inherit; font-size: 14px; padding: 7px 10px; color: var(--text);
                                                     border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
#skill-form input[type=text]:focus, #skill-form textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
#skill-form textarea { flex: 1; resize: none; font: 13px/1.5 var(--mono); }
#skill-form .hint { font-size: 12px; color: var(--amber); }
#skill-form .row { display: flex; gap: 8px; align-items: center; }
#skill-form .spacer { flex: 1; }
#skill-status { font-size: 13px; color: var(--muted); min-height: 1.5em; }
#skill-status.error { color: var(--warn); }
body.dragging #chat { outline: 2px dashed var(--accent); outline-offset: -8px; }

.msg { margin: 0 0 22px; }
.msg .who { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.msg .who .status { color: var(--warn); }
.msg.user .body { background: var(--user); padding: 10px 14px; border-radius: 10px; }
/* Typed text keeps its spacing (indented lines, aligned columns) even outside a code block;
   only inside the blocks, so the newlines between them don't show as blank lines. */
.msg.user .body :is(p, li, td, th) { white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.system .body { color: var(--muted); font-style: italic; }
.body > :first-child { margin-top: 0; } .body > :last-child { margin-bottom: 0; }
.body p, .body ul, .body ol, .body pre, .body blockquote, .body table { margin: 0 0 .8em; }
.body h1, .body h2, .body h3, .body h4 { margin: 1.1em 0 .5em; line-height: 1.3; }
.body h1 { font-size: 1.3em; } .body h2 { font-size: 1.18em; } .body h3, .body h4 { font-size: 1.05em; }
.body code { font: .9em var(--mono); background: var(--code); padding: .1em .3em; border-radius: 4px; }
.body pre { background: var(--code); padding: 10px 12px; border-radius: 8px; overflow-x: auto; }
.body pre code { background: none; padding: 0; font-size: .85em; }
.body blockquote { border-left: 3px solid var(--line); margin-left: 0; padding-left: 12px; color: var(--muted); }
.body table { border-collapse: collapse; display: block; overflow-x: auto; }
.body th, .body td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
.body a { color: var(--accent); }
.body hr { border: 0; border-top: 1px solid var(--line); }
.plain { white-space: pre-wrap; overflow-wrap: anywhere; }
details.thinking { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
details.thinking summary { cursor: pointer; }
details.thinking .plain { border-left: 3px solid var(--line); padding-left: 10px; margin-top: 6px; }
.files { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.files .remove { border: 0; background: none; color: var(--muted); padding: 0 0 0 6px; font-size: 13px; line-height: 1; }
.files .remove:hover { color: var(--warn); }
.files span.asking { font-family: var(--sans); white-space: normal; display: inline-flex; flex-wrap: wrap;
                     align-items: center; gap: 6px; }
.files span.asking .btn { padding: 1px 8px; font-size: 12px; }
.files span { font: 12px var(--mono); background: var(--code); border: 1px solid var(--line);
              padding: 2px 7px; border-radius: 6px; overflow-wrap: anywhere; }

@media (max-width: 720px) {
  #sidebar { width: 100%; border-right: 0; }
  #main { display: none; }

  /* The message box gets the width: its two buttons shrink around it. */

  #composer .btn.attach, #composer .btn.go { width: 36px; height: 36px; margin-bottom: 3px; }
  #composer .btn.attach svg, #composer .btn.go svg { width: 18px; height: 18px; }
}
</style>

<body>

    <button id="rail-search" class="edge" type="button" title="Search sessions" aria-label="Search sessions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>

            title="Collapse sessions (⌘B / Ctrl+B)" aria-label="Collapse sessions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>

    <div class="title-row">

      <button id="header-toggle" class="rename" type="button" aria-expanded="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg></button>
    </div>
    <div class="meta-row"><span id="meta" class="meta"></span><span id="status" class="status-line" aria-live="polite"></span></div>
    <div class="controls">
      <select id="model" class="btn" aria-label="Model"></select>
      <button id="skills-btn" class="btn" type="button" aria-expanded="false">Skills: none</button>
      <div id="skills-panel" class="panel" hidden></div>
      <span class="spacer"></span>
      <span id="session-actions">
        <button id="archive-btn" class="btn icon" type="button" title="Archive" aria-label="Archive"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg></button>
        <button id="export-btn" class="btn icon" type="button" title="Export" aria-label="Export" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg></button>
        <button id="delete-btn" class="btn icon danger" type="button" title="Delete" aria-label="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg></button>
      </span>
      <div id="export-panel" class="panel" hidden>
        <label><input id="export-thinking" type="checkbox"><span>Include reasoning<small>The model's thinking, folded under each reply</small></span></label>
        <div class="actions">
          <button class="btn" type="button">Download markdown</button>

      <input id="file" type="file" multiple hidden>

      <button id="go" class="btn primary go" type="submit" title="Send (Enter)" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 5v7a3 3 0 0 1-3 3H5"/><path d="m9 11-4 4 4 4"/></svg></button>

</main>
<div id="skills-sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="skills-heading">
    <header>
      <h3 id="skills-heading">Skills</h3>
      <button id="skill-new" class="btn" type="button">New skill</button>
      <button id="skills-done" class="btn primary" type="button">Done</button>
    </header>
    <ul id="skills-list"></ul>
    <form id="skill-form" hidden>
      <label class="field">Name
        <input id="skill-name" type="text" placeholder="e.g. concise" autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
      <div id="skill-rename-hint" class="hint" hidden>Chats that use it by its old name will need it turned on again.</div>
      <label class="field">Description
        <input id="skill-description" type="text" placeholder="One line on what it's for" autocomplete="off">
      </label>
      <label class="field grow">Instructions
        <textarea id="skill-body" placeholder="What the model should do while this skill is on"></textarea>
      </label>
      <div class="row">
        <button class="btn primary" type="submit">Save</button>
        <button id="skill-cancel" class="btn" type="button">Cancel</button>
        <span class="spacer"></span>

      </div>
      <div id="skill-status" aria-live="polite"></div>
    </form>
  </div>

<script>
"use strict";
const $ = (sel) => document.querySelector(sel);
let names = { user: "User", assistant: "Assistant" };

async function api(path) {
  const res = await fetch("/api" + path);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v; else if (k === "html") node.innerHTML = v;
    else node.setAttribute(k, v);
  }
  node.append(...children.filter((c) => c != null));
  return node;
}

function when(iso) {
  const d = new Date(iso), now = new Date();
  if (d.toDateString() === now.toDateString())
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  return d.toLocaleDateString([], { month: "short", day: "numeric",
                                    year: d.getFullYear() === now.getFullYear() ? undefined : "numeric" });
}

// -- markdown: escape everything first, then add only the markup we recognise ----------------

const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function inline(text) {
  const codes = [];
  let s = esc(text).replace(/`([^`\n]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`);
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
       .replace(/\*\*(?=\S)(.+?)\*\*/g, "<strong>$1</strong>")
       .replace(/__(?=\S)(.+?)__/g, "<strong>$1</strong>")
       .replace(/(^|[^*\w])\*(?=\S)([^*\n]+?)\*(?!\w)/g, "$1<em>$2</em>")
       .replace(/(^|[^_\w])_(?=\S)([^_\n]+?)_(?!\w)/g, "$1<em>$2</em>")
       .replace(/~~(.+?)~~/g, "<del>$1</del>");
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
}

function markdown(src) {
  const lines = src.replace(/\r\n?/g, "\n").split("\n");
  const out = [];
  let i = 0;
  const isTableRow = (l) => /^\s*\|.*\|\s*$/.test(l);
  const cells = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
  while (i < lines.length) {
    const line = lines[i];
    let m;
    if ((m = line.match(/^\s*(```|~~~)\s*([\w+-]*)/))) {
      const fence = m[1], body = [];
      for (i++; i < lines.length && !lines[i].trim().startsWith(fence); i++) body.push(lines[i]);
      i++;
      out.push(`<pre><code>${esc(body.join("\n"))}</code></pre>`);
    } else if (!line.trim()) {
      i++;
    } else if ((m = line.match(/^(#{1,6})\s+(.*)$/))) {
      const n = Math.min(m[1].length, 4);
      out.push(`<h${n}>${inline(m[2].replace(/\s#+\s*$/, ""))}</h${n}>`); i++;
    } else if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) {
      out.push("<hr>"); i++;
    } else if (isTableRow(line) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1]) && lines[i + 1].includes("-")) {
      const head = cells(line);
      i += 2;
      const rows = [];
      while (i < lines.length && isTableRow(lines[i])) rows.push(cells(lines[i++]));
      out.push("<table><thead><tr>" + head.map((c) => `<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>" +
               rows.map((r) => "<tr>" + r.map((c) => `<td>${inline(c)}</td>`).join("") + "</tr>").join("") + "</tbody></table>");
    } else if (/^\s*>/.test(line)) {
      const body = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) body.push(lines[i++].replace(/^\s*>\s?/, ""));
      out.push(`<blockquote>${markdown(body.join("\n"))}</blockquote>`);
    } else if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) {
      const ordered = /^\s*\d/.test(line), items = [];
      while (i < lines.length && lines[i].trim()) {
        if ((m = lines[i].match(/^\s*([-*+]|\d+[.)])\s+(.*)$/)) && (/^\d/.test(m[1]) === ordered)) items.push(m[2]);
        else if (items.length && /^\s+\S/.test(lines[i])) items[items.length - 1] += "\n" + lines[i].trim();
        else break;
        i++;
      }
      const tag = ordered ? "ol" : "ul";
      out.push(`<${tag}>` + items.map((t) => `<li>${inline(t).replace(/\n/g, "<br>")}</li>`).join("") + `</${tag}>`);
    } else {
      const para = [];
      while (i < lines.length && lines[i].trim() && !/^(\s*(```|~~~|>|[-*+]\s|\d+[.)]\s)|#{1,6}\s)/.test(lines[i])) para.push(lines[i++]);
      if (!para.length) para.push(lines[i++]);
      out.push(`<p>${inline(para.join("\n")).replace(/\n/g, "<br>")}</p>`);
    }
  }
  return out.join("\n");
}

// -- sessions -------------------------------------------------------------------------------

let current = null, searchTimer = null, streaming = null, quietHash = false;
let session = null;                       // the open session, as the server last described it
let models = [], defaultModel = "", allSkills = [];
// Choices for a new chat, until its first message.
const draft = { model: "", skills: [] };
let pending = [];                         // files to go with the next message: {name, data, size}
const chat = () => $("#chat .inner");

function remembered(key, value) {
  try { if (value === undefined) return localStorage.getItem(key); localStorage.setItem(key, value); } catch {}
  return null;
}

let viewArchived = false;                  // the sidebar shows archived sessions instead

async function loadSessions() {
  const q = $("#search").value.trim();
  const params = new URLSearchParams();
  if (q) params.set("search", q);
  if (viewArchived) params.set("archived", "1");
  const { sessions, archived_count } = await api("/sessions" + (params.size ? "?" + params : ""));
  const list = $("#sessions");
  list.replaceChildren(...sessions.map((s) => el("li", {},
    el("a", { href: "#" + s.id, "data-id": s.id },
       el("span", { class: "title" }, s.title || "(untitled)"),
       el("span", { class: "meta" }, `${when(s.updated_at)} · ${s.message_count} messages · ${s.model}`)))));
  if (viewArchived) list.prepend(el("li", { class: "viewing" }, "Archived"));
  if (!sessions.length) list.append(el("li", { class: "empty" },
    q ? "No sessions match." : viewArchived ? "Nothing archived." : "No sessions yet."));
  const link = $("#archived-link");
  link.hidden = !viewArchived && !archived_count;
  link.textContent = viewArchived ? "‹ Active sessions" : "Archived";
  $("#search").placeholder = viewArchived ? "Search archived" : "Search sessions";
  markCurrent();
}

function showArchived(on) {
  viewArchived = on;
  $("#search").value = "";
  loadSessions();
}

function markCurrent() {
  for (const a of document.querySelectorAll("#sessions a"))
    a.toggleAttribute("aria-current", a.dataset.id === current);
}

function showHeader(s) {
  session = s;
  if (!s) {
    $("#title").textContent = "New chat";
    $("#meta").textContent = "The first message starts the session.";
    document.title = "acc";
  } else {
    $("#title").textContent = s.title || "(untitled)";
    document.title = `${s.title || s.id} · acc`;
    $("#meta").textContent = s.id + (s.archived_at ? ` · archived ${when(s.archived_at)}` : "");
  }
  showControls();
}

// -- model and skills -------------------------------------------------------------------------

const skillName = (ref) => ref.replace(/\/SKILL\.md$/, "").split("/").pop().replace(/\.md$/, "");

function showControls() {
  const chosen = session ? session.model : draft.model || defaultModel;
  const names = models.map((m) => m.name);
  const options = [];
  if (chosen && !names.includes(chosen)) options.push(el("option", { value: chosen }, `${chosen} (not installed)`));
  for (const m of models)
    options.push(el("option", { value: m.name }, m.parameter_size ? `${m.name} · ${m.parameter_size}` : m.name));
  $("#model").replaceChildren(...options);
  $("#model").value = chosen;
  $("#session-actions").hidden = !session;
  $("#rename-btn").hidden = !session;
  if (session) {
    const label = session.archived_at ? "Unarchive" : "Archive";
    const b = $("#archive-btn");
    b.title = label;
    b.setAttribute("aria-label", label);
    b.innerHTML = session.archived_at ? ICONS.unarchive : ICONS.archive;
  }
  const refs = session ? session.skills : draft.skills;
  $("#skills-btn").textContent = "Skills: " + (refs.length ? refs.map(skillName).join(", ") : "none");
  if (!$("#skills-panel").hidden) fillSkills();
}

async function change(update) {
  if (!session) {
    Object.assign(draft, update);
    return showControls();
  }
  try {
    const res = await fetch("/api/sessions/" + encodeURIComponent(session.id), {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(update),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    showHeader(data.session);
    loadSessions();
  } catch (e) {
    showControls();
    note(e.message, "error");
  }
}

function fillSkills() {
  const refs = session ? session.skills : draft.skills;
  const attached = new Set(refs.map(skillName));
  const known = allSkills.map((s) => s.name);
  const rows = [...allSkills, ...refs.filter((r) => !known.includes(skillName(r)))
                                     .map((r) => ({ name: skillName(r), ref: r, description: "not on the skills path" }))];
  const panel = $("#skills-panel");
  panel.replaceChildren(...rows.map((s) => {
    const box = el("input", { type: "checkbox" });
    box.checked = attached.has(s.name);
    box.addEventListener("change", () => {
      const ref = s.ref || s.name;
      const next = box.checked ? [...refs, ref] : refs.filter((r) => skillName(r) !== s.name);
      change({ skills: next });
    });
    return el("label", {}, box, el("span", {}, s.name, s.description ? el("small", {}, s.description) : null));
  }));
  if (!rows.length) panel.append(el("div", { class: "empty" }, "No skills yet."));
  const manage = el("button", { class: "btn", type: "button" }, "Manage skills…");
  manage.addEventListener("click", openSkills);
  panel.append(el("div", { class: "actions" }, manage));
}

async function loadChoices() {
  try {
    ({ models, default: defaultModel } = await api("/models"));
    defaultModel = defaultModel || "";
  } catch (e) { models = []; defaultModel = ""; }
  try { takeSkills(await api("/skills")); } catch (e) { allSkills = []; }
  showControls();
}

// -- managing skills ------------------------------------------------------------------------------
// Each user has skills of their own and nobody else's: they can be made, changed, renamed or
// deleted here. What a session has turned on is its own business.

let skillLibrary = [];                     // the user's own skills, the ones the sheet can change
let editingSkill = null;                   // the name of the skill in the form; null for a new one

function takeSkills(data) {
  allSkills = data.skills;
  skillLibrary = data.library;
}

function openSkills() {
  closePanels();
  $("#skills-sheet").hidden = false;
  showSkillList();
}

function closeSkills() {
  $("#skills-sheet").hidden = true;
  showControls();
}

function showSkillList() {
  editingSkill = null;
  $("#skill-form").hidden = true;
  $("#skills-list").hidden = false;
  $("#skill-new").hidden = $("#skills-done").hidden = false;
  $("#skills-heading").textContent = "Skills";
  const rows = skillLibrary.map((k) => {
    const b = el("button", { type: "button" }, k.name, k.description ? el("small", {}, k.description) : null);
    b.addEventListener("click", () => editSkill(k));
    return el("li", {}, b);
  });
  $("#skills-list").replaceChildren(el("li", { class: "section" }, "Your skills"),
    ...(rows.length ? rows : [el("li", { class: "empty" }, "None yet. Only you see the skills you keep here.")]));
}

async function editSkill(k) {
  try { showSkillForm(await api(`/skills/${encodeURIComponent(k.name)}`)); }
  catch (e) { note(e.message, "error"); }
}

function showSkillForm(skill) {
  editingSkill = skill.name || null;
  $("#skills-list").hidden = true;
  $("#skill-form").hidden = false;
  $("#skill-new").hidden = $("#skills-done").hidden = true;
  $("#skills-heading").textContent = editingSkill || "New skill";
  $("#skill-name").value = skill.name || "";
  $("#skill-description").value = skill.description || "";
  $("#skill-body").value = skill.body || "";
  $("#skill-rename-hint").hidden = true;
  const del = $("#skill-delete");
  del.hidden = !editingSkill;
  del.classList.remove("asking");
  del.textContent = "Delete";
  skillStatus("");
  (editingSkill ? $("#skill-body") : $("#skill-name")).focus();
}

function skillStatus(text, error = false) {
  $("#skill-status").textContent = text;
  $("#skill-status").classList.toggle("error", error);
}

async function skillRequest(method, path, body) {
  const res = await fetch("/api" + path, {
    method, headers: { "Content-Type": "application/json" }, body: body && JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

async function saveSkill(e) {
  e.preventDefault();
  try {
    takeSkills(await skillRequest("POST", "/skills", {
      name: $("#skill-name").value.trim(), description: $("#skill-description").value,
      body: $("#skill-body").value, was: editingSkill }));
    showSkillList();
  } catch (err) {
    skillStatus(err.message, true);
  }
}

async function deleteSkill() {
  const del = $("#skill-delete");
  if (!del.classList.contains("asking")) {  // ask once, in place
    del.classList.add("asking");
    del.textContent = "Delete it? Click again";
    return;
  }
  try {
    takeSkills(await skillRequest("DELETE", `/skills/${encodeURIComponent(editingSkill)}`));
    showSkillList();
  } catch (err) {
    skillStatus(err.message, true);
  }
}

// -- rename, export, delete --------------------------------------------------------------------

function closePanels(except) {
  for (const [panel, button] of [["#skills-panel", "#skills-btn"], ["#export-panel", "#export-btn"]]) {
    if (panel === except) continue;
    $(panel).hidden = true;
    $(button).setAttribute("aria-expanded", "false");
  }
}

function togglePanel(panel, button) {
  closePanels(panel);
  $(panel).hidden = !$(panel).hidden;
  $(button).setAttribute("aria-expanded", String(!$(panel).hidden));
  return !$(panel).hidden;
}

function rename() {
  if (!session) return;
  const input = el("input", { id: "title-edit", "aria-label": "Title" });
  input.value = session.title || "";
  const title = $("#title");
  title.replaceChildren(input);
  $("#rename-btn").hidden = true;          // the box itself is the rename now
  input.focus();
  input.select();
  let done = false;
  const finish = (save) => {
    if (done) return;
    done = true;
    const text = input.value.trim();
    title.textContent = session.title || "(untitled)";
    $("#rename-btn").hidden = !session;
    if (save && text && text !== session.title) change({ title: text });
  };
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); finish(true); }
    else if (e.key === "Escape") finish(false);
  });
  input.addEventListener("blur", () => finish(true));
}

async function exportSession() {
  if (!session) return;
  const id = session.id, status = $("#export-status");
  const buttons = $("#export-panel").querySelectorAll("button");
  buttons.forEach((b) => { b.disabled = true; });
  status.hidden = false;
  status.textContent = session.title && session.title_source !== "auto" ? "Exporting…" : "Naming this session, then exporting…";
  try {
    const res = await fetch(`/api/sessions/${encodeURIComponent(id)}/export`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ thinking: $("#export-thinking").checked }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    if (session && session.id === id) showHeader(data.session);
    loadSessions();
    for (const line of data.notes) note(line);
    const url = URL.createObjectURL(new Blob([data.text], { type: "text/markdown;charset=utf-8" }));
    const link = el("a", { href: url, download: data.filename });
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    closePanels();
  } catch (e) {
    note(e.message, "error");
  } finally {
    buttons.forEach((b) => { b.disabled = false; });
    status.hidden = true;
  }
  scrollDown(true);
}

// Delete asks in place: the button becomes a question with its own answer buttons.
function askDelete() {
  if (!session) return;
  const actions = $("#session-actions"), before = [...actions.childNodes];
  const yes = el("button", { class: "btn danger primary", type: "button" }, "Delete");
  const no = el("button", { class: "btn", type: "button" }, "Keep");
  const count = session.message_count;
  actions.replaceChildren(el("span", { class: "confirm" }, `Delete this session${count ? ` and its ${count} messages` : ""}? `), " ", yes, " ", no);
  const restore = () => actions.replaceChildren(...before);
  no.addEventListener("click", restore);
  no.focus();
  yes.addEventListener("click", async () => {
    try {
      const res = await fetch("/api/sessions/" + encodeURIComponent(session.id), { method: "DELETE" });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
      restore();
      location.hash = "new";
      loadSessions();
    } catch (e) {
      restore();
      note(e.message, "error");
    }
  });
}

// -- files to attach ------------------------------------------------------------------------

const MAX_UPLOAD = 40 * 1024 * 1024;

function size(n) {
  return n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(1)} KB` : `${(n / 1048576).toFixed(1)} MB`;
}

function showPending() {
  $("#pending").replaceChildren(...pending.map((f, i) => {
    const drop = el("button", { type: "button", title: "Remove", "aria-label": `Remove ${f.name}` }, "×");
    drop.addEventListener("click", () => { pending.splice(i, 1); showPending(); });
    return el("span", { class: "chip" }, `${f.name} · ${size(f.size)}`, drop);
  }));
}

function readFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).replace(/^data:[^,]*,/, ""));
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

async function addFiles(list) {
  for (const file of list) {
    const total = pending.reduce((n, f) => n + f.size, 0) + file.size;
    if (total > MAX_UPLOAD) { note(`${file.name} is too large: one message takes up to ${size(MAX_UPLOAD)} of files`, "error"); continue; }
    const name = file.name || `pasted-${Date.now()}.${(file.type.split("/")[1] || "bin")}`;
    try { pending.push({ name, size: file.size, data: await readFile(file) }); }
    catch (e) { note(`can't read ${name}: ${e.message}`, "error"); }
  }
  showPending();
  $("#input").focus();
}

// A file that came with a message. A saved one can be taken out of the conversation: the model
// doesn't see it again.
function fileChip(a) {
  const name = a.path.split("/").pop() || a.path;
  const chip = el("span", { title: [a.path, a.note].filter(Boolean).join(" · ") }, name);
  if (a.id == null) return chip;
  const x = el("button", { type: "button", class: "remove", title: "Remove from this conversation",
                           "aria-label": `Remove ${name} from this conversation` }, "×");
  chip.append(x);
  x.addEventListener("click", () => {
    const before = [...chip.childNodes];
    const yes = el("button", { class: "btn danger primary", type: "button" }, "Remove");
    const no = el("button", { class: "btn", type: "button" }, "Keep");
    chip.classList.add("asking");
    chip.replaceChildren(`Remove ${name} from this conversation?`, yes, no);
    const restore = () => { chip.classList.remove("asking"); chip.replaceChildren(...before); };
    no.addEventListener("click", restore);
    no.focus({ preventScroll: true });
    yes.addEventListener("click", async () => {
      try {
        const res = await fetch(`/api/attachments/${a.id}`, { method: "DELETE" });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.statusText);
        const article = chip.closest("article"), list = chip.parentElement;
        chip.remove();
        article?.querySelector(`.thumbs img[src="/api/attachments/${a.id}"]`)?.remove();
        if (list && !list.children.length) list.remove();
        const thumbs = article?.querySelector(".thumbs");
        if (thumbs && !thumbs.children.length) thumbs.remove();
      } catch (e) {
        restore();
        note(e.message, "error");
      }
    });
  });
  return chip;
}

function renderMessage(m) {
  const who = m.role === "user" ? names.user : m.role === "assistant" ? names.assistant : m.role;
  const status = m.status !== "complete" ? el("span", { class: "status" }, ` · ${m.status}`) : null;
  // A message is markdown whoever wrote it: the model gets the text as typed, the page renders it.
  const body = el("div", { class: "body", html: markdown(m.content) });
  const thinking = m.thinking
    ? el("details", { class: "thinking" }, el("summary", {}, "Thinking"), el("div", { class: "plain" }, m.thinking))
    : null;
  const files = m.attachments.length ? el("div", { class: "files" }, ...m.attachments.map(fileChip)) : null;
  const pictures = m.attachments.filter((a) => a.kind === "image" && a.id != null);
  const thumbs = pictures.length
    ? el("div", { class: "thumbs" }, ...pictures.map((a) => el("img", { src: `/api/attachments/${a.id}`, alt: a.path, loading: "lazy" })))
    : null;
  const article = el("article", { class: `msg ${m.role}` },
                    el("div", { class: "who" }, who, status), thinking, body, files, thumbs);
  if (m.seq != null) article.append(messageActions(m, article));
  return article;
}

// -- copy and delete, per message ---------------------------------------------------------------

const ICON_SVG = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
const ICONS = {
  copy: '<svg %SVG%><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>',
  copied: '<svg %SVG%><path d="M20 6 9 17l-5-5"/></svg>',
  archive: '<svg %SVG%><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/><path d="M10 12h4"/></svg>',
  unarchive: '<svg %SVG%><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/><path d="m9 15 3-3 3 3"/><path d="M12 12v6"/></svg>',
  trash: '<svg %SVG%><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>',
};
for (const k in ICONS) ICONS[k] = ICONS[k].replace("%SVG%", ICON_SVG);

async function copyText(text) {
  try {
    // A browser that never answers (no permission prompt shown, say) mustn't leave it hanging.
    await Promise.race([navigator.clipboard.writeText(text),
                        new Promise((_, fail) => setTimeout(() => fail(new Error("no answer")), 500))]);
  } catch {                                // no clipboard access: the old way still works
    const area = el("textarea", { style: "position:fixed;opacity:0" });
    area.value = text;
    document.body.append(area);
    area.select();
    document.execCommand("copy");
    area.remove();
  }
}

// Copy (the text as written: markdown, for a reply) and delete (after asking), under a message.
function messageActions(m, article) {
  const bar = el("div", { class: "actions" });
  const copy = el("button", { type: "button", class: "act", title: "Copy", "aria-label": "Copy message", html: ICONS.copy });
  const drop = el("button", { type: "button", class: "act", title: "Delete", "aria-label": "Delete message", html: ICONS.trash });
  bar.append(copy, drop);
  copy.addEventListener("click", async () => {
    await copyText(m.content);
    copy.innerHTML = ICONS.copied;
    copy.title = "Copied";
    setTimeout(() => { copy.innerHTML = ICONS.copy; copy.title = "Copy"; }, 1200);
  });
  drop.addEventListener("click", () => {
    if (streaming) { note("Wait for the reply to finish, then delete."); return; }
    const before = [...bar.childNodes];
    const yes = el("button", { class: "btn danger primary", type: "button" }, "Delete");
    const no = el("button", { class: "btn", type: "button" }, "Keep");
    bar.classList.add("asking");
    bar.replaceChildren(el("span", { class: "confirm" }, "Delete this message?"), yes, no);
    const restore = () => { bar.classList.remove("asking"); bar.replaceChildren(...before); };
    no.addEventListener("click", restore);
    no.focus({ preventScroll: true });
    yes.addEventListener("click", async () => {
      try {
        const id = current;
        const res = await fetch(`/api/sessions/${encodeURIComponent(id)}/messages/${m.seq}`, { method: "DELETE" });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.statusText);
        // Taken out where it is: the view stays put rather than jumping to the end.
        article.remove();
        loadSessions();
        if (current !== id) return;
        showHeader(data.session);
        chat().querySelectorAll(".note").forEach((n) => { if (n.querySelector("button")) n.remove(); });
        const { messages } = await api("/sessions/" + encodeURIComponent(id));
        if (current !== id) return;
        if (!messages.length) chat().replaceChildren(el("p", { class: "placeholder" }, "No messages yet."));
        offerRetry(messages);              // if it now ends on a question with no answer
      } catch (e) {
        restore();
        note(e.message, "error");
      }
    });
  });
  return bar;
}

function note(text, kind = "") {
  const node = el("p", { class: `note ${kind}` }, text);
  chat().append(node);
  return node;
}

// The last message is a question with no good answer yet: offer to ask again.
function offerRetry(messages) {
  const last = messages[messages.length - 1];
  if (!last || !(last.role === "user" || last.status !== "complete")) return;
  const why = last.role === "user" ? "No reply yet." : `The reply was ${last.status}.`;
  const button = el("button", { class: "btn", type: "button" }, "Retry");
  button.addEventListener("click", () => send({ retry: true }));
  note(why).append(button);
}

async function openSession(id) {
  leaveReply();                            // a reply this page follows goes on without it
  current = id;
  markCurrent();
  document.body.classList.toggle("reading", id !== null);
  if (!id || id === "new") {
    current = null;
    showHeader(null);
    Object.assign(stats, { usage: null, speed: null, live: null });
    showStatus();
    chat().replaceChildren(el("p", { class: "placeholder" }, "Start a new conversation."));
    $("#input").focus();
    return;
  }
  try {
    const { session, messages, usage, replying } = await api("/sessions/" + encodeURIComponent(id));
    if (current !== id) return;
    showHeader(session);
    Object.assign(stats, { usage, speed: null, live: null });
    showStatus();
    chat().replaceChildren(...(messages.length ? messages.map(renderMessage)
                                               : [el("p", { class: "placeholder" }, "No messages yet.")]));
    if (replying) follow(id); else offerRetry(messages);
    scrollDown(true);
  } catch (e) {
    $("#title").textContent = "";
    $("#meta").textContent = "";
    chat().replaceChildren(el("p", { class: "placeholder" }, e.message));
  }
}

function scrollDown(force) {
  const box = $("#chat");
  if (force || box.scrollHeight - box.scrollTop - box.clientHeight < 120) box.scrollTop = box.scrollHeight;
}

// -- context and speed ----------------------------------------------------------------------------

// What the header shows beside the session id: context in use as the latest reply left it, and
// how fast replies come. While one streams, its speed is counted live (a chunk is a token).
const stats = { usage: null, speed: null, live: null };

function tokens(n) {
  return n < 1000 ? String(n) : n < 10000 ? (n / 1000).toFixed(1).replace(/\.0$/, "") + "k" : Math.round(n / 1000) + "k";
}

function showStatus() {
  const line = $("#status");
  line.classList.remove("full-ish", "full");
  if (!session && !stats.live) { line.replaceChildren(); return; }
  const parts = [];
  const u = stats.usage;
  if (u && u.used != null) {
    if (u.context) {
      const share = u.used / u.context;
      line.classList.add(share >= 0.95 ? "full" : share >= 0.8 ? "full-ish" : "ok");
      const about = u.exact ? "" : "~";
      const title = `${u.used.toLocaleString()} of ${about}${u.context.toLocaleString()} tokens` + (u.exact ? ""
        : ". The model isn't loaded, so its window is taken from its settings; it is exact once the model is loaded");
      const meter = el("span", { class: "meter" }, el("i"));
      meter.firstChild.style.width = Math.min(100, share * 100).toFixed(1) + "%";
      parts.push(el("span", { class: "usage", title }, meter,
        `${tokens(u.used)} / ${about}${tokens(u.context)} context (${Math.round(share * 100)}%)` +
        (share >= 0.95 ? " · nearly full: Ollama drops the oldest messages" : "")));
    } else {
      parts.push(el("span", { class: "usage", title: "The model isn't loaded, so its context window isn't known" },
                    `${tokens(u.used)} tokens of context`));
    }
  }
  const speed = stats.live ? stats.live.rate : stats.speed;
  if (speed) parts.push(`${Math.round(speed)} tok/s${stats.live ? " …" : ""}`);
  line.replaceChildren(...parts.flatMap((p, i) => (i ? [" · ", p] : [p])));
}

let tickDrawn = 0;
function tick() {
  const now = performance.now();
  if (!stats.live) stats.live = { start: now, count: 0, rate: null };
  stats.live.count++;
  const seconds = (now - stats.live.start) / 1000;
  if (stats.live.count > 3 && seconds > 0.3) stats.live.rate = (stats.live.count - 1) / seconds;
  if (now - tickDrawn > 250) { tickDrawn = now; showStatus(); }
}

// -- sending --------------------------------------------------------------------------------

function setStreaming(on) {
  streaming = on;
  // Return sends; while a reply streams the same button stops it.
  $("#go").innerHTML = on ? '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 5v7a3 3 0 0 1-3 3H5"/><path d="m9 11-4 4 4 4"/></svg>';
  $("#go").title = on ? "Stop" : "Send (Enter)";
  $("#go").setAttribute("aria-label", on ? "Stop" : "Send");
  $("#go").classList.toggle("primary", !on);
}

// A reply being written: thinking and text grow as they arrive, drawn at most once a frame.
function pendingReply() {
  const body = el("div", { class: "body" });
  const think = el("div", { class: "plain" });
  const details = el("details", { class: "thinking", open: "" }, el("summary", {}, "Thinking"), think);
  details.hidden = true;
  const node = el("article", { class: "msg assistant pending" },
                  el("div", { class: "who" }, names.assistant), details, body);
  let content = "", thinking = "", queued = false;
  const draw = () => {
    queued = false;
    think.textContent = thinking;
    details.hidden = !thinking;
    if (content) details.open = false;
    body.innerHTML = markdown(content);
    scrollDown();
  };
  return {
    node,
    add(kind, text) {
      if (kind === "thinking") thinking += text; else content += text;
      if (!queued) { queued = true; requestAnimationFrame(draw); }
    },
  };
}

// Replies are written on the server whether or not a page watches: leaving one only stops
// following it, and opening its session again picks it up. `streaming` is the one this page
// follows: { ctrl, stopped, stopSent, left }.
function following() {
  return { ctrl: new AbortController(), stopped: false, stopSent: false, left: false };
}

function leaveReply() {
  if (!streaming) return;
  streaming.left = true;
  streaming.ctrl.abort();
}

function stopReply() {
  if (!streaming || streaming.stopped) return;
  streaming.stopped = true;
  if (current) postStop(current);          // a new chat's is sent when its id arrives
}

function postStop(id) {
  if (!streaming || streaming.stopSent) return;
  streaming.stopSent = true;
  fetch(`/api/sessions/${encodeURIComponent(id)}/stop`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: "{}",
  }).catch(() => {});
}

// Draw a reply's events as they come. `st` says afterwards what arrived: the message sent
// (sent), the reply as it grew (reply), and whether the reply reached its end (ended).
async function readReply(res, st) {
  const reader = res.body.getReader(), decoder = new TextDecoder();
  let buffer = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    let nl;
    while ((nl = buffer.indexOf("\n")) >= 0) {
      const line = buffer.slice(0, nl);
      buffer = buffer.slice(nl + 1);
      if (!line.trim()) continue;
      const event = JSON.parse(line);
      if (event.type === "session") {
        if (current !== event.session.id) {
          current = event.session.id;
          quietHash = true;
          location.hash = current;
        }
        if (streaming?.stopped) postStop(current);
        showHeader(event.session);
        loadSessions();
      } else if (event.type === "note") {
        note(event.text);
      } else if (event.type === "message" && event.message.role === "user") {
        st.sent = true;
        const saved = renderMessage(event.message);
        if (st.early) { st.early.replaceWith(saved); st.early = null; } else chat().append(saved);
        st.reply = pendingReply();
        chat().append(st.reply.node);
        scrollDown(true);
      } else if (event.type === "thinking" || event.type === "content") {
        if (!st.reply) { st.reply = pendingReply(); chat().append(st.reply.node); }
        st.reply.add(event.type, event.text);
        tick();
      } else if (event.type === "message") {
        const done = renderMessage(event.message);
        if (st.reply) st.reply.node.replaceWith(done); else chat().append(done);
        st.reply = null;
        scrollDown();
      } else if (event.type === "error") {
        st.failed = st.ended = true;
        st.error = event.text;
        note(event.text, "error");
      } else if (event.type === "done") {
        st.ended = true;
        stats.usage = { used: event.used, context: event.context, exact: event.exact };
        stats.speed = event.speed;         // Ollama's own figure replaces the live estimate
        stats.live = null;
        showStatus();
      }
    }
  }
}

function doneFollowing(mine) {
  if (streaming !== mine) return;          // the page has moved on to another reply
  setStreaming(null);
  if (stats.live) {                        // stopped or cut off: the count so far is the speed
    stats.speed = stats.live.rate;
    stats.live = null;
    showStatus();
  }
}

async function send(request) {
  const mine = following();
  setStreaming(mine);
  if (!current) chat().replaceChildren();
  chat().querySelectorAll(".note").forEach((n) => { if (n.querySelector("button")) n.remove(); });
  const st = { reply: null, sent: false, early: null, failed: false, error: null, ended: false };
  const { files, ...rest } = request;
  if (request.text !== undefined) {
    // Shown straight away, files and all: reading them on the server can take a while.
    st.early = renderMessage({ role: "user", content: request.text, status: "complete", attachments:
      (files || []).map((f) => ({ path: f.name, kind: "upload", note: size(f.size) })) });
    st.early.classList.add("sending");
    st.early.querySelector(".who").append(el("span", { class: "status" }, " · sending"));
    chat().append(st.early);
    scrollDown(true);
  }
  const body = { session: current, ...rest };
  if (files?.length) body.files = files.map((f) => ({ name: f.name, data: f.data }));
  if (!current) Object.assign(body, { model: draft.model || defaultModel || null, skills: draft.skills });
  try {
    const res = await fetch("/api/chat", {
      method: "POST", signal: mine.ctrl.signal, headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!res.ok) { st.failed = true; throw new Error((await res.json()).error || res.statusText); }
    await readReply(res, st);
  } catch (e) {
    // Cut off once the message is in, the reply goes on on the server: reopening follows it.
    if (e.name !== "AbortError" && (st.failed || !st.sent)) {
      st.failed = true;
      st.error = e.message;
      note(e.message, "error");
    }
  } finally {
    doneFollowing(mine);
  }
  if (mine.left) return;                   // the page moved on; the reply goes on without it
  if (st.early) st.early.remove();         // it never arrived; the text goes back in the box
  if (!st.sent && request.text !== undefined) {
    // It never arrived: give the message and its files back rather than lose them.
    if (!$("#input").value.trim()) { $("#input").value = request.text; grow(); }
    if (!pending.length && files) pending = files;
    showPending();
  }
  if (!st.ended || st.failed) {
    // Stopped, failed or cut off: show what the server has, which follows a reply still going.
    const id = current;
    if (id) {
      await openSession(id);
      if (st.error && current === id) { note(st.error, "error"); scrollDown(true); }
    } else if (st.reply) st.reply.node.remove();
  }
  loadSessions();
}

// Pick up a reply the server is still writing, from its start, as if it had been sent here.
async function follow(id) {
  const mine = following();
  setStreaming(mine);
  const st = { reply: pendingReply(), sent: true, failed: false, error: null, ended: false };
  chat().append(st.reply.node);
  scrollDown(true);
  let res = null;
  try {
    res = await fetch(`/api/sessions/${encodeURIComponent(id)}/reply`, { signal: mine.ctrl.signal });
    if (res.ok) await readReply(res, st);
  } catch {
  } finally {
    doneFollowing(mine);
  }
  if (mine.left || current !== id) return;
  if (!res?.ok) { st.reply.node.remove(); return; }
  if (!st.ended || st.failed) {
    // Stopped or failed: show where it stands. Cut off: the same, after a moment's grace.
    if (!st.ended && !mine.stopped) await new Promise((done) => setTimeout(done, 1000));
    if (current !== id || streaming) return;
    await openSession(id);
    if (st.error && current === id) { note(st.error, "error"); scrollDown(true); }
  }
  loadSessions();
}

function submit() {
  if (streaming) { stopReply(); return; }
  const input = $("#input"), text = input.value.trim();
  if (!text) {
    if (pending.length) note("Add a few words to go with the files.");
    return;
  }
  input.value = "";
  grow();
  const files = pending;
  pending = [];
  showPending();
  send({ text, files });
}

function grow() {
  const input = $("#input");
  input.style.height = "auto";
  input.style.height = input.scrollHeight + 2 + "px";
}

$("#send").addEventListener("submit", (e) => { e.preventDefault(); submit(); });
$("#input").addEventListener("input", grow);
$("#input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!streaming) submit(); }
});
$("#new").addEventListener("click", () => { location.hash = "new"; });

// The sessions list can shrink to a rail for more room; the choice is remembered on this browser.
function showSidebar(show) {
  document.body.classList.toggle("sidebar-collapsed", !show);
  const label = show ? "Collapse sessions" : "Expand sessions";
  $("#sidebar-toggle").setAttribute("aria-expanded", String(show));
  $("#sidebar-toggle").setAttribute("aria-label", label);
  $("#sidebar-toggle").title = `${label} (⌘B / Ctrl+B)`;
  remembered("acc.sidebar", show ? "shown" : "collapsed");
}
const collapsed = () => document.body.classList.contains("sidebar-collapsed");
$("#sidebar-toggle").addEventListener("click", () => showSidebar(collapsed()));
$("#rail-new").addEventListener("click", () => { location.hash = "new"; });
$("#rail-search").addEventListener("click", () => { showSidebar(true); $("#search").focus(); });
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === "b") {
    e.preventDefault();
    showSidebar(collapsed());
  }
});
showSidebar(!["collapsed", "hidden"].includes(remembered("acc.sidebar")));

// The header can fold to just the title, which matters most on a phone; remembered like the list.
function foldHeader(fold) {
  document.body.classList.toggle("header-collapsed", fold);
  const label = fold ? "Show session details" : "Hide session details";
  $("#header-toggle").setAttribute("aria-expanded", String(!fold));
  $("#header-toggle").setAttribute("aria-label", label);
  $("#header-toggle").title = label;
  if (fold) closePanels();
  remembered("acc.header", fold ? "collapsed" : "shown");
}
$("#header-toggle").addEventListener("click", () =>
  foldHeader(!document.body.classList.contains("header-collapsed")));
foldHeader(remembered("acc.header") === "collapsed");
$("#model").addEventListener("change", () => change({ model: $("#model").value }));
$("#skills-btn").addEventListener("click", () => { if (togglePanel("#skills-panel", "#skills-btn")) fillSkills(); });
$("#export-btn").addEventListener("click", () => togglePanel("#export-panel", "#export-btn"));
$("#archive-btn").addEventListener("click", () => { if (session) change({ archived: !session.archived_at }); });
$("#archived-link").addEventListener("click", () => showArchived(!viewArchived));
$("#export-panel").addEventListener("click", (e) => {
  if (e.target.closest("button")) exportSession();
});
$("#rename-btn").addEventListener("click", rename);
$("#title").addEventListener("dblclick", rename);
$("#delete-btn").addEventListener("click", askDelete);
document.addEventListener("click", (e) => { if (!e.target.closest(".controls")) closePanels(); });
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (!$("#skills-sheet").hidden) {          // the form goes back to the list; the list closes
    e.preventDefault();
    if (!$("#skill-form").hidden) showSkillList(); else closeSkills();
  } else closePanels();
});
$("#skill-new").addEventListener("click", () => showSkillForm({}));
$("#skills-done").addEventListener("click", closeSkills);
$("#skill-cancel").addEventListener("click", showSkillList);
$("#skill-delete").addEventListener("click", deleteSkill);
$("#skill-form").addEventListener("submit", saveSkill);
$("#skill-name").addEventListener("input", () => {
  $("#skill-rename-hint").hidden = !editingSkill || $("#skill-name").value.trim() === editingSkill;
});
$("#skills-sheet").addEventListener("click", (e) => {   // outside the sheet: only the list closes
  if (e.target === $("#skills-sheet") && $("#skill-form").hidden) closeSkills();
});
$("#attach").addEventListener("click", () => $("#file").click());
$("#file").addEventListener("change", () => { addFiles([...$("#file").files]); $("#file").value = ""; });
$("#input").addEventListener("paste", (e) => {
  const list = [...(e.clipboardData?.files || [])];
  if (list.length) { e.preventDefault(); addFiles(list); }
});
let dragDepth = 0;
$("#main").addEventListener("dragenter", (e) => {
  if (![...e.dataTransfer.types].includes("Files")) return;
  e.preventDefault(); dragDepth++; document.body.classList.add("dragging");
});
$("#main").addEventListener("dragover", (e) => { if ([...e.dataTransfer.types].includes("Files")) e.preventDefault(); });
$("#main").addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dragging"); } });
$("#main").addEventListener("drop", (e) => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove("dragging");
  addFiles([...e.dataTransfer.files]);
});
$("#search").addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(loadSessions, 200);
});
$("#back").addEventListener("click", () => { location.hash = ""; });
window.addEventListener("hashchange", () => {
  if (quietHash) { quietHash = false; markCurrent(); return; }
  openSession(location.hash.slice(1) || null);
});

(async () => {
  try {
    names = (await api("/config")).names;
    $("#me").textContent = names.user;     // whose sessions these are: acc can serve several people
  } catch {}
  await loadSessions();
  loadChoices();
  openSession(location.hash.slice(1) || "new");
  document.body.classList.toggle("reading", !!location.hash.slice(1));
})();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
