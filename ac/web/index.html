<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>acc</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23d9772b'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #fbfaf8; --panel: #f3f1ed; --text: #1f1d1a; --muted: #6f6a62; --line: #e2ded6;
  --accent: #c8651b; --accent-soft: #f6e4d4; --user: #ecebe7; --code: #f0eee9; --warn: #a33b2b;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1a18; --panel: #232220; --text: #ebe8e2; --muted: #9c968c; --line: #34322e;
    --accent: #e08a45; --accent-soft: #3a2a1d; --user: #2b2a27; --code: #262522; --warn: #e07a66;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.55 var(--sans); display: flex; }

#sidebar { width: 300px; flex: none; background: var(--panel); border-right: 1px solid var(--line);
           display: flex; flex-direction: column; min-height: 0; }
#sidebar header { padding: 14px 14px 10px; }
#sidebar .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
#sidebar h1 { font-size: 15px; margin: 0; color: var(--accent); letter-spacing: .02em; }
button { font: inherit; cursor: pointer; }
.btn { border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 8px;
       padding: 5px 12px; font-size: 13px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }
#search { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px;
          background: var(--bg); color: var(--text); font: inherit; font-size: 14px; }
#search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
#sessions { list-style: none; margin: 0; padding: 0 8px 12px; overflow-y: auto; flex: 1; }
#sessions li a { display: block; padding: 8px 10px; border-radius: 8px; color: inherit;
                 text-decoration: none; }
#sessions li a:hover { background: var(--user); }
#sessions li a[aria-current] { background: var(--accent-soft); }
#sessions .title { display: block; font-size: 14px; white-space: nowrap; overflow: hidden;
                   text-overflow: ellipsis; }
#sessions .meta { display: block; font-size: 12px; color: var(--muted); }
#sessions .empty { padding: 10px; color: var(--muted); font-size: 14px; }

#main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
#main > header { padding: 14px 24px; border-bottom: 1px solid var(--line); }
#main > header h2 { margin: 0; font-size: 17px; overflow-wrap: anywhere; }
#main > header .meta { font-size: 13px; color: var(--muted); }
#back { display: none; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; position: relative; }
select.btn { padding-right: 8px; max-width: 100%; }
.panel { position: absolute; top: 100%; left: 0; z-index: 5; margin-top: 4px; min-width: 260px;
                max-width: min(420px, calc(100vw - 32px)); max-height: 50vh; overflow-y: auto;
                background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
                box-shadow: 0 8px 24px rgba(0, 0, 0, .12); padding: 6px; }
.panel label { display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px;
                      border-radius: 6px; cursor: pointer; font-size: 14px; }
.panel label:hover { background: var(--panel); }
.panel input { margin-top: 4px; accent-color: var(--accent); }
.panel small { display: block; color: var(--muted); font-size: 12px; }
.panel .empty { padding: 6px 8px; color: var(--muted); font-size: 13px; }
#export-panel { left: auto; right: 0; }
.panel .actions { display: flex; flex-direction: column; gap: 6px; padding: 6px 8px 4px; }
.panel .actions .btn { text-align: left; }
.panel .status { padding: 4px 8px; font-size: 13px; color: var(--muted); }
.controls .spacer { flex: 1; }
.controls .confirm { font-size: 13px; color: var(--warn); align-self: center; }
.btn.danger { color: var(--warn); }
.btn.danger.primary { background: var(--warn); border-color: var(--warn); color: #fff; }
#title-edit { width: 100%; font: 600 17px var(--sans); padding: 2px 6px; border: 1px solid var(--accent);
              border-radius: 6px; background: var(--bg); color: var(--text); }
#chat { flex: 1; overflow-y: auto; padding: 20px 24px 40px; }
#chat .inner { max-width: 780px; margin: 0 auto; }
.placeholder { color: var(--muted); text-align: center; margin-top: 20vh; }
.note { font-size: 13px; color: var(--muted); margin: -12px 0 18px; }
.note.error { color: var(--warn); }
.note .btn { margin-left: 8px; }
.msg.pending .body:empty::after { content: "…"; color: var(--muted); }

#composer { border-top: 1px solid var(--line); padding: 12px 24px 16px; }
#composer form { max-width: 780px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
#input { flex: 1; resize: none; min-height: 42px; max-height: 40vh; padding: 10px 12px;
         border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text);
         font: inherit; line-height: 1.45; }
#input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
#composer .btn { padding: 10px 16px; font-size: 14px; }
#composer .btn.attach { padding: 10px 12px; }
#pending { max-width: 780px; margin: 0 auto 8px; display: flex; flex-wrap: wrap; gap: 6px; }
#pending:empty { display: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 12px var(--mono);
        background: var(--code); border: 1px solid var(--line); padding: 3px 4px 3px 8px; border-radius: 6px; }
.chip button { border: 0; background: none; color: var(--muted); padding: 0 4px; font-size: 14px; line-height: 1; }
.chip button:hover { color: var(--warn); }
.thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.thumbs img { max-width: 220px; max-height: 180px; border-radius: 8px; border: 1px solid var(--line); }
body.dragging #chat { outline: 2px dashed var(--accent); outline-offset: -8px; }

.msg { margin: 0 0 22px; }
.msg .who { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.msg .who .status { color: var(--warn); }
.msg.user .body { background: var(--user); padding: 10px 14px; border-radius: 10px; }
.msg.system .body { color: var(--muted); font-style: italic; }
.body > :first-child { margin-top: 0; } .body > :last-child { margin-bottom: 0; }
.body p, .body ul, .body ol, .body pre, .body blockquote, .body table { margin: 0 0 .8em; }
.body h1, .body h2, .body h3, .body h4 { margin: 1.1em 0 .5em; line-height: 1.3; }
.body h1 { font-size: 1.3em; } .body h2 { font-size: 1.18em; } .body h3, .body h4 { font-size: 1.05em; }
.body code { font: .9em var(--mono); background: var(--code); padding: .1em .3em; border-radius: 4px; }
.body pre { background: var(--code); padding: 10px 12px; border-radius: 8px; overflow-x: auto; }
.body pre code { background: none; padding: 0; font-size: .85em; }
.body blockquote { border-left: 3px solid var(--line); margin-left: 0; padding-left: 12px; color: var(--muted); }
.body table { border-collapse: collapse; display: block; overflow-x: auto; }
.body th, .body td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
.body a { color: var(--accent); }
.body hr { border: 0; border-top: 1px solid var(--line); }
.plain { white-space: pre-wrap; overflow-wrap: anywhere; }
details.thinking { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
details.thinking summary { cursor: pointer; }
details.thinking .plain { border-left: 3px solid var(--line); padding-left: 10px; margin-top: 6px; }
.files { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.files span { font: 12px var(--mono); background: var(--code); border: 1px solid var(--line);
              padding: 2px 7px; border-radius: 6px; overflow-wrap: anywhere; }

@media (max-width: 720px) {
  #sidebar { width: 100%; border-right: 0; }
  #main { display: none; }
  body.reading #sidebar { display: none; }
  body.reading #main { display: flex; }
  #back { display: inline; background: none; border: 0; color: var(--accent); font: inherit;
          padding: 0; margin-bottom: 4px; cursor: pointer; }
  #main > header, #chat, #composer { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>
<body>
<nav id="sidebar">
  <header>
    <div class="top"><h1>acc</h1><button id="new" class="btn" type="button">New chat</button></div>
    <input id="search" type="search" placeholder="Search sessions" autocomplete="off">
  </header>
  <ul id="sessions"></ul>
</nav>
<main id="main">
  <header>
    <button id="back" type="button">‹ Sessions</button>
    <h2 id="title"></h2>
    <div id="meta" class="meta"></div>
    <div class="controls">
      <select id="model" class="btn" aria-label="Model"></select>
      <button id="skills-btn" class="btn" type="button" aria-expanded="false">Skills: none</button>
      <div id="skills-panel" class="panel" hidden></div>
      <span class="spacer"></span>
      <span id="session-actions">
        <button id="rename-btn" class="btn" type="button">Rename</button>
        <button id="export-btn" class="btn" type="button" aria-expanded="false">Export</button>
        <button id="delete-btn" class="btn danger" type="button">Delete</button>
      </span>
      <div id="export-panel" class="panel" hidden>
        <label><input id="export-thinking" type="checkbox"><span>Include reasoning<small>In markdown; JSON always has it</small></span></label>
        <div class="actions">
          <button class="btn" type="button" data-save="1">Save to export folder</button>
          <button class="btn" type="button" data-format="md">Download markdown</button>
          <button class="btn" type="button" data-format="json">Download JSON</button>
        </div>
        <div id="export-status" class="status" hidden></div>
      </div>
    </div>
  </header>
  <div id="chat"><div class="inner"></div></div>
  <div id="composer">
    <div id="pending"></div>
    <form id="send">
      <button id="attach" class="btn attach" type="button" title="Attach files" aria-label="Attach files">+</button>
      <input id="file" type="file" multiple hidden>
      <textarea id="input" rows="1" placeholder="Message" aria-label="Message"></textarea>
      <button id="go" class="btn primary" type="submit">Send</button>
    </form>
  </div>
</main>
<script>
"use strict";
const $ = (sel) => document.querySelector(sel);
let names = { user: "User", assistant: "Assistant" };

async function api(path) {
  const res = await fetch("/api" + path);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v; else if (k === "html") node.innerHTML = v;
    else node.setAttribute(k, v);
  }
  node.append(...children.filter((c) => c != null));
  return node;
}

function when(iso) {
  const d = new Date(iso), now = new Date();
  if (d.toDateString() === now.toDateString())
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  return d.toLocaleDateString([], { month: "short", day: "numeric",
                                    year: d.getFullYear() === now.getFullYear() ? undefined : "numeric" });
}

// -- markdown: escape everything first, then add only the markup we recognise ----------------

const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function inline(text) {
  const codes = [];
  let s = esc(text).replace(/`([^`\n]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`);
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
       .replace(/\*\*(?=\S)(.+?)\*\*/g, "<strong>$1</strong>")
       .replace(/__(?=\S)(.+?)__/g, "<strong>$1</strong>")
       .replace(/(^|[^*\w])\*(?=\S)([^*\n]+?)\*(?!\w)/g, "$1<em>$2</em>")
       .replace(/(^|[^_\w])_(?=\S)([^_\n]+?)_(?!\w)/g, "$1<em>$2</em>")
       .replace(/~~(.+?)~~/g, "<del>$1</del>");
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
}

function markdown(src) {
  const lines = src.replace(/\r\n?/g, "\n").split("\n");
  const out = [];
  let i = 0;
  const isTableRow = (l) => /^\s*\|.*\|\s*$/.test(l);
  const cells = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
  while (i < lines.length) {
    const line = lines[i];
    let m;
    if ((m = line.match(/^\s*(```|~~~)\s*([\w+-]*)/))) {
      const fence = m[1], body = [];
      for (i++; i < lines.length && !lines[i].trim().startsWith(fence); i++) body.push(lines[i]);
      i++;
      out.push(`<pre><code>${esc(body.join("\n"))}</code></pre>`);
    } else if (!line.trim()) {
      i++;
    } else if ((m = line.match(/^(#{1,6})\s+(.*)$/))) {
      const n = Math.min(m[1].length, 4);
      out.push(`<h${n}>${inline(m[2].replace(/\s#+\s*$/, ""))}</h${n}>`); i++;
    } else if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) {
      out.push("<hr>"); i++;
    } else if (isTableRow(line) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1]) && lines[i + 1].includes("-")) {
      const head = cells(line);
      i += 2;
      const rows = [];
      while (i < lines.length && isTableRow(lines[i])) rows.push(cells(lines[i++]));
      out.push("<table><thead><tr>" + head.map((c) => `<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>" +
               rows.map((r) => "<tr>" + r.map((c) => `<td>${inline(c)}</td>`).join("") + "</tr>").join("") + "</tbody></table>");
    } else if (/^\s*>/.test(line)) {
      const body = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) body.push(lines[i++].replace(/^\s*>\s?/, ""));
      out.push(`<blockquote>${markdown(body.join("\n"))}</blockquote>`);
    } else if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) {
      const ordered = /^\s*\d/.test(line), items = [];
      while (i < lines.length && lines[i].trim()) {
        if ((m = lines[i].match(/^\s*([-*+]|\d+[.)])\s+(.*)$/)) && (/^\d/.test(m[1]) === ordered)) items.push(m[2]);
        else if (items.length && /^\s+\S/.test(lines[i])) items[items.length - 1] += "\n" + lines[i].trim();
        else break;
        i++;
      }
      const tag = ordered ? "ol" : "ul";
      out.push(`<${tag}>` + items.map((t) => `<li>${inline(t).replace(/\n/g, "<br>")}</li>`).join("") + `</${tag}>`);
    } else {
      const para = [];
      while (i < lines.length && lines[i].trim() && !/^(\s*(```|~~~|>|[-*+]\s|\d+[.)]\s)|#{1,6}\s)/.test(lines[i])) para.push(lines[i++]);
      if (!para.length) para.push(lines[i++]);
      out.push(`<p>${inline(para.join("\n")).replace(/\n/g, "<br>")}</p>`);
    }
  }
  return out.join("\n");
}

// -- sessions -------------------------------------------------------------------------------

let current = null, searchTimer = null, streaming = null, quietHash = false;
let session = null;                       // the open session, as the server last described it
let models = [], allSkills = [];
const draft = { model: "", skills: [] };  // choices for a new chat, until its first message
let pending = [];                         // files to go with the next message: {name, data, size}
const chat = () => $("#chat .inner");

async function loadSessions() {
  const q = $("#search").value.trim();
  const { sessions } = await api("/sessions" + (q ? "?search=" + encodeURIComponent(q) : ""));
  const list = $("#sessions");
  list.replaceChildren(...sessions.map((s) => el("li", {},
    el("a", { href: "#" + s.id, "data-id": s.id },
       el("span", { class: "title" }, s.title || "(untitled)"),
       el("span", { class: "meta" }, `${when(s.updated_at)} · ${s.message_count} messages · ${s.model}`)))));
  if (!sessions.length) list.append(el("li", { class: "empty" }, q ? "No sessions match." : "No sessions yet."));
  markCurrent();
}

function markCurrent() {
  for (const a of document.querySelectorAll("#sessions a"))
    a.toggleAttribute("aria-current", a.dataset.id === current);
}

function showHeader(s) {
  session = s;
  if (!s) {
    $("#title").textContent = "New chat";
    $("#meta").textContent = "The first message starts the session.";
    document.title = "acc";
  } else {
    $("#title").textContent = s.title || "(untitled)";
    document.title = `${s.title || s.id} · acc`;
    $("#meta").textContent = s.id;
  }
  showControls();
}

// -- model and skills -------------------------------------------------------------------------

const skillName = (ref) => ref.replace(/\/SKILL\.md$/, "").split("/").pop().replace(/\.md$/, "");

function showControls() {
  const chosen = session ? session.model : draft.model;
  const names = models.map((m) => m.name);
  const options = [];
  if (!session) options.push(el("option", { value: "" }, "Default model"));
  if (chosen && !names.includes(chosen)) options.push(el("option", { value: chosen }, `${chosen} (not installed)`));
  for (const m of models)
    options.push(el("option", { value: m.name }, m.parameter_size ? `${m.name} · ${m.parameter_size}` : m.name));
  $("#model").replaceChildren(...options);
  $("#model").value = chosen || "";
  $("#session-actions").hidden = !session;
  const refs = session ? session.skills : draft.skills;
  $("#skills-btn").textContent = "Skills: " + (refs.length ? refs.map(skillName).join(", ") : "none");
  if (!$("#skills-panel").hidden) fillSkills();
}

async function change(update) {
  if (!session) {
    Object.assign(draft, update);
    return showControls();
  }
  try {
    const res = await fetch("/api/sessions/" + encodeURIComponent(session.id), {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(update),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    showHeader(data.session);
    loadSessions();
  } catch (e) {
    showControls();
    note(e.message, "error");
  }
}

function fillSkills() {
  const refs = session ? session.skills : draft.skills;
  const attached = new Set(refs.map(skillName));
  const known = allSkills.map((s) => s.name);
  const rows = [...allSkills, ...refs.filter((r) => !known.includes(skillName(r)))
                                     .map((r) => ({ name: skillName(r), ref: r, description: "not on the skills path" }))];
  const panel = $("#skills-panel");
  panel.replaceChildren(...rows.map((s) => {
    const box = el("input", { type: "checkbox" });
    box.checked = attached.has(s.name);
    box.addEventListener("change", () => {
      const ref = s.ref || s.name;
      const next = box.checked ? [...refs, ref] : refs.filter((r) => skillName(r) !== s.name);
      change({ skills: next });
    });
    return el("label", {}, box, el("span", {}, s.name, s.description ? el("small", {}, s.description) : null));
  }));
  if (!rows.length) panel.append(el("div", { class: "empty" }, "No skills yet. Add them to ~/accspace/config/skills."));
}

async function loadChoices() {
  try { models = (await api("/models")).models; } catch (e) { models = []; }
  try { allSkills = (await api("/skills")).skills; } catch (e) { allSkills = []; }
  showControls();
}

// -- rename, export, delete --------------------------------------------------------------------

function closePanels(except) {
  for (const [panel, button] of [["#skills-panel", "#skills-btn"], ["#export-panel", "#export-btn"]]) {
    if (panel === except) continue;
    $(panel).hidden = true;
    $(button).setAttribute("aria-expanded", "false");
  }
}

function togglePanel(panel, button) {
  closePanels(panel);
  $(panel).hidden = !$(panel).hidden;
  $(button).setAttribute("aria-expanded", String(!$(panel).hidden));
  return !$(panel).hidden;
}

function rename() {
  if (!session) return;
  const input = el("input", { id: "title-edit", "aria-label": "Title" });
  input.value = session.title || "";
  const title = $("#title");
  title.replaceChildren(input);
  input.focus();
  input.select();
  let done = false;
  const finish = (save) => {
    if (done) return;
    done = true;
    const text = input.value.trim();
    title.textContent = session.title || "(untitled)";
    if (save && text && text !== session.title) change({ title: text });
  };
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); finish(true); }
    else if (e.key === "Escape") finish(false);
  });
  input.addEventListener("blur", () => finish(true));
}

async function exportSession(request) {
  if (!session) return;
  const id = session.id, status = $("#export-status");
  const buttons = $("#export-panel").querySelectorAll("button");
  buttons.forEach((b) => { b.disabled = true; });
  status.hidden = false;
  status.textContent = session.title && session.title_source !== "auto" ? "Exporting…" : "Naming this session, then exporting…";
  try {
    const res = await fetch(`/api/sessions/${encodeURIComponent(id)}/export`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ...request, thinking: $("#export-thinking").checked }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    if (session && session.id === id) showHeader(data.session);
    loadSessions();
    for (const line of data.notes) note(line);
    if (data.path) {
      note(`Saved ${data.path}`);
    } else {
      const type = request.format === "json" ? "application/json" : "text/markdown";
      const url = URL.createObjectURL(new Blob([data.text], { type: type + ";charset=utf-8" }));
      const link = el("a", { href: url, download: data.filename });
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    closePanels();
  } catch (e) {
    note(e.message, "error");
  } finally {
    buttons.forEach((b) => { b.disabled = false; });
    status.hidden = true;
  }
  scrollDown(true);
}

// Delete asks in place: the button becomes a question with its own answer buttons.
function askDelete() {
  if (!session) return;
  const actions = $("#session-actions"), before = [...actions.childNodes];
  const yes = el("button", { class: "btn danger primary", type: "button" }, "Delete");
  const no = el("button", { class: "btn", type: "button" }, "Keep");
  const count = session.message_count;
  actions.replaceChildren(el("span", { class: "confirm" }, `Delete this session${count ? ` and its ${count} messages` : ""}? `), " ", yes, " ", no);
  const restore = () => actions.replaceChildren(...before);
  no.addEventListener("click", restore);
  no.focus();
  yes.addEventListener("click", async () => {
    try {
      const res = await fetch("/api/sessions/" + encodeURIComponent(session.id), { method: "DELETE" });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
      restore();
      location.hash = "new";
      loadSessions();
    } catch (e) {
      restore();
      note(e.message, "error");
    }
  });
}

// -- files to attach ------------------------------------------------------------------------

const MAX_UPLOAD = 40 * 1024 * 1024;

function size(n) {
  return n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(1)} KB` : `${(n / 1048576).toFixed(1)} MB`;
}

function showPending() {
  $("#pending").replaceChildren(...pending.map((f, i) => {
    const drop = el("button", { type: "button", title: "Remove", "aria-label": `Remove ${f.name}` }, "×");
    drop.addEventListener("click", () => { pending.splice(i, 1); showPending(); });
    return el("span", { class: "chip" }, `${f.name} · ${size(f.size)}`, drop);
  }));
}

function readFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).replace(/^data:[^,]*,/, ""));
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

async function addFiles(list) {
  for (const file of list) {
    const total = pending.reduce((n, f) => n + f.size, 0) + file.size;
    if (total > MAX_UPLOAD) { note(`${file.name} is too large: one message takes up to ${size(MAX_UPLOAD)} of files`, "error"); continue; }
    const name = file.name || `pasted-${Date.now()}.${(file.type.split("/")[1] || "bin")}`;
    try { pending.push({ name, size: file.size, data: await readFile(file) }); }
    catch (e) { note(`can't read ${name}: ${e.message}`, "error"); }
  }
  showPending();
  $("#input").focus();
}

function renderMessage(m) {
  const who = m.role === "user" ? names.user : m.role === "assistant" ? names.assistant : m.role;
  const status = m.status !== "complete" ? el("span", { class: "status" }, ` · ${m.status}`) : null;
  const body = m.role === "assistant"
    ? el("div", { class: "body", html: markdown(m.content) })
    : el("div", { class: "body plain" }, m.content);
  const thinking = m.thinking
    ? el("details", { class: "thinking" }, el("summary", {}, "Thinking"), el("div", { class: "plain" }, m.thinking))
    : null;
  const files = m.attachments.length
    ? el("div", { class: "files" }, ...m.attachments.map((a) => el("span", { title: a.note || a.kind }, a.path)))
    : null;
  const pictures = m.attachments.filter((a) => a.kind === "image" && a.id != null);
  const thumbs = pictures.length
    ? el("div", { class: "thumbs" }, ...pictures.map((a) => el("img", { src: `/api/attachments/${a.id}`, alt: a.path, loading: "lazy" })))
    : null;
  return el("article", { class: `msg ${m.role}` },
            el("div", { class: "who" }, who, status), thinking, body, files, thumbs);
}

function note(text, kind = "") {
  const node = el("p", { class: `note ${kind}` }, text);
  chat().append(node);
  return node;
}

// The last message is a question with no good answer yet: offer to ask again.
function offerRetry(messages) {
  const last = messages[messages.length - 1];
  if (!last || !(last.role === "user" || last.status !== "complete")) return;
  const why = last.role === "user" ? "No reply yet." : `The reply was ${last.status}.`;
  const button = el("button", { class: "btn", type: "button" }, "Retry");
  button.addEventListener("click", () => send({ retry: true }));
  note(why).append(button);
}

async function openSession(id) {
  if (streaming) return;
  current = id;
  markCurrent();
  document.body.classList.toggle("reading", id !== null);
  if (!id || id === "new") {
    current = null;
    showHeader(null);
    chat().replaceChildren(el("p", { class: "placeholder" }, "Start a new conversation."));
    $("#input").focus();
    return;
  }
  try {
    const { session, messages } = await api("/sessions/" + encodeURIComponent(id));
    if (current !== id) return;
    showHeader(session);
    chat().replaceChildren(...(messages.length ? messages.map(renderMessage)
                                               : [el("p", { class: "placeholder" }, "No messages yet.")]));
    offerRetry(messages);
    scrollDown(true);
  } catch (e) {
    $("#title").textContent = "";
    $("#meta").textContent = "";
    chat().replaceChildren(el("p", { class: "placeholder" }, e.message));
  }
}

function scrollDown(force) {
  const box = $("#chat");
  if (force || box.scrollHeight - box.scrollTop - box.clientHeight < 120) box.scrollTop = box.scrollHeight;
}

// -- sending --------------------------------------------------------------------------------

function setStreaming(on) {
  streaming = on;
  $("#go").textContent = on ? "Stop" : "Send";
  $("#go").classList.toggle("primary", !on);
  $("#new").disabled = !!on;
}

// A reply being written: thinking and text grow as they arrive, drawn at most once a frame.
function pendingReply() {
  const body = el("div", { class: "body" });
  const think = el("div", { class: "plain" });
  const details = el("details", { class: "thinking", open: "" }, el("summary", {}, "Thinking"), think);
  details.hidden = true;
  const node = el("article", { class: "msg assistant pending" },
                  el("div", { class: "who" }, names.assistant), details, body);
  let content = "", thinking = "", queued = false;
  const draw = () => {
    queued = false;
    think.textContent = thinking;
    details.hidden = !thinking;
    if (content) details.open = false;
    body.innerHTML = markdown(content);
    scrollDown();
  };
  return {
    node,
    add(kind, text) {
      if (kind === "thinking") thinking += text; else content += text;
      if (!queued) { queued = true; requestAnimationFrame(draw); }
    },
  };
}

async function send(request) {
  const ctrl = new AbortController();
  setStreaming(ctrl);
  if (!current) chat().replaceChildren();
  chat().querySelectorAll(".note").forEach((n) => { if (n.querySelector("button")) n.remove(); });
  let reply = null, failed = false, sent = false;
  const body = { session: current, ...request };
  if (!current) Object.assign(body, { model: draft.model || null, skills: draft.skills });
  try {
    const res = await fetch("/api/chat", {
      method: "POST", signal: ctrl.signal, headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error((await res.json()).error || res.statusText);
    const reader = res.body.getReader(), decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let nl;
      while ((nl = buffer.indexOf("\n")) >= 0) {
        const line = buffer.slice(0, nl);
        buffer = buffer.slice(nl + 1);
        if (!line.trim()) continue;
        const event = JSON.parse(line);
        if (event.type === "session") {
          if (current !== event.session.id) {
            current = event.session.id;
            quietHash = true;
            location.hash = current;
          }
          showHeader(event.session);
          loadSessions();
        } else if (event.type === "note") {
          note(event.text);
        } else if (event.type === "message" && event.message.role === "user") {
          sent = true;
          chat().append(renderMessage(event.message));
          reply = pendingReply();
          chat().append(reply.node);
          scrollDown(true);
        } else if (event.type === "thinking" || event.type === "content") {
          if (!reply) { reply = pendingReply(); chat().append(reply.node); }
          reply.add(event.type, event.text);
        } else if (event.type === "message") {
          const done = renderMessage(event.message);
          if (reply) reply.node.replaceWith(done); else chat().append(done);
          reply = null;
          scrollDown();
        } else if (event.type === "error") {
          failed = true;
          note(event.text, "error");
        } else if (event.type === "done" && event.used && event.context) {
          $("#meta").textContent += ` · ${event.used.toLocaleString()} / ${event.context.toLocaleString()} tokens`;
        }
      }
    }
  } catch (e) {
    if (e.name !== "AbortError") { failed = true; note(e.message, "error"); }
  } finally {
    setStreaming(null);
  }
  if (!sent && request.text !== undefined) {
    // It never arrived: give the message and its files back rather than lose them.
    if (!$("#input").value.trim()) { $("#input").value = request.text; grow(); }
    if (!pending.length && request.files) { pending = request.files; showPending(); }
  }
  if (ctrl.signal.aborted || failed) {
    // What was kept is on the server now; show it as saved, with the offer to try again.
    if (current) setTimeout(() => openSession(current), ctrl.signal.aborted ? 300 : 0);
    else if (reply) reply.node.remove();
  }
  loadSessions();
}

function submit() {
  if (streaming) { streaming.abort(); return; }
  const input = $("#input"), text = input.value.trim();
  if (!text) {
    if (pending.length) note("Add a few words to go with the files.");
    return;
  }
  input.value = "";
  grow();
  const files = pending;
  pending = [];
  showPending();
  send({ text, files });
}

function grow() {
  const input = $("#input");
  input.style.height = "auto";
  input.style.height = input.scrollHeight + 2 + "px";
}

$("#send").addEventListener("submit", (e) => { e.preventDefault(); submit(); });
$("#input").addEventListener("input", grow);
$("#input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!streaming) submit(); }
});
$("#new").addEventListener("click", () => { location.hash = "new"; });
$("#model").addEventListener("change", () => change({ model: $("#model").value }));
$("#skills-btn").addEventListener("click", () => { if (togglePanel("#skills-panel", "#skills-btn")) fillSkills(); });
$("#export-btn").addEventListener("click", () => togglePanel("#export-panel", "#export-btn"));
$("#export-panel").addEventListener("click", (e) => {
  const button = e.target.closest("button");
  if (!button) return;
  exportSession(button.dataset.save ? { save: true, format: "md" } : { format: button.dataset.format });
});
$("#rename-btn").addEventListener("click", rename);
$("#title").addEventListener("dblclick", rename);
$("#delete-btn").addEventListener("click", askDelete);
document.addEventListener("click", (e) => { if (!e.target.closest(".controls")) closePanels(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePanels(); });
$("#attach").addEventListener("click", () => $("#file").click());
$("#file").addEventListener("change", () => { addFiles([...$("#file").files]); $("#file").value = ""; });
$("#input").addEventListener("paste", (e) => {
  const list = [...(e.clipboardData?.files || [])];
  if (list.length) { e.preventDefault(); addFiles(list); }
});
let dragDepth = 0;
$("#main").addEventListener("dragenter", (e) => {
  if (![...e.dataTransfer.types].includes("Files")) return;
  e.preventDefault(); dragDepth++; document.body.classList.add("dragging");
});
$("#main").addEventListener("dragover", (e) => { if ([...e.dataTransfer.types].includes("Files")) e.preventDefault(); });
$("#main").addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dragging"); } });
$("#main").addEventListener("drop", (e) => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove("dragging");
  addFiles([...e.dataTransfer.files]);
});
$("#search").addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(loadSessions, 200);
});
$("#back").addEventListener("click", () => { location.hash = ""; });
window.addEventListener("hashchange", () => {
  if (quietHash) { quietHash = false; markCurrent(); return; }
  openSession(location.hash.slice(1) || null);
});

(async () => {
  try { names = (await api("/config")).names; } catch {}
  await loadSessions();
  loadChoices();
  openSession(location.hash.slice(1) || "new");
  document.body.classList.toggle("reading", !!location.hash.slice(1));
})();
</script>
</body>
</html>
